# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G

# MC 26.x ships an unobfuscated jar (official names baked in) with no separate mappings;
# tell Loom to skip all obfuscation handling (no mappings config, identity remap).
fabric.loom.disableObfuscation=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1
# No Yarn mappings exist for 26.x - this build uses official Mojang mappings
# (see build.gradle: loom.officialMojangMappings()).
# yarn_mappings=(unused)
loader_version=0.19.5
# Mod Properties
mod_version=1.0.0
maven_group=com.terrainaddon
archives_base_name=axiom-terrain-addon

# Dependencies
# Fabric API release for 26.1 (see Modrinth fabric-api).
fabric_version=0.155.2+26.1.2

# Axiom (client-side world editor) - required to compile against its addon API.
# Its jar is NOT redistributed here (Axiom is closed-source, "All Rights Reserved").
# This version just names the file expected at libs/axiom-<version>.jar - see libs/README.md.
axiom_version=5.4.2
# Version of Axiom's nested addon-api module. In the 26.1 jar it ships as
# 'axiomclientapi-unobf.jar' (official/mojmap namespace); we expose it as a flatDir module
# named 'axiomclientapi-<version>.jar'. The '5.4.2' below is just the local Axiom release tag -
# the nested module itself has no public version number.
axiom_clientapi_version=5.4.2